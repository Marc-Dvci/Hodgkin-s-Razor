<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
    <style>
      rect{rx:10}
      .box{fill:#fcfcfb;stroke:#c9c8c2;stroke-width:1.4}
      .blue{fill:#eef5fd;stroke:#2a78d6;stroke-width:1.6}
      .orange{fill:#fdf1ea;stroke:#eb6834;stroke-width:1.6}
      .aqua{fill:#e9f7f1;stroke:#1baf7a;stroke-width:1.6}
      .t{font-size:13.5px;fill:#0b0b0b;font-weight:600}
      .s{font-size:11.5px;fill:#52514e}
      .h{font-size:12px;fill:#2a78d6;font-weight:700;letter-spacing:.07em}
      .lbl{font-size:11px;fill:#52514e;font-style:italic}
      .edge{stroke:#52514e;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .dash{stroke:#8a8984;stroke-width:1.2;fill:none;stroke-dasharray:4 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect x="0" y="0" width="1040" height="560" fill="#fcfcfb" rx="0"/>

  <text x="28" y="34" class="h">HODGKIN'S RAZOR · END-TO-END</text>
  <text x="28" y="54" class="s">two recordings of one well in; the mechanism the compound moved, or a refusal, out</text>

  <rect x="28" y="80" width="170" height="92" class="box blue"/>
  <text x="42" y="106" class="t">Recording pair</text>
  <text x="42" y="126" class="s">baseline and treated,</text>
  <text x="42" y="142" class="s">same well, matched windows</text>
  <text x="42" y="158" class="s">spike CSV / MCS / Axion</text>

  <path class="edge" d="M198 126 L232 126"/>

  <rect x="232" y="80" width="176" height="92" class="box"/>
  <text x="246" y="106" class="t">Recording system</text>
  <text x="246" y="126" class="s">electrode layout and</text>
  <text x="246" y="142" class="s">detection dead time,</text>
  <text x="246" y="158" class="s">applied to data and twin alike</text>

  <path class="edge" d="M408 126 L442 126"/>

  <rect x="442" y="80" width="170" height="92" class="box"/>
  <text x="456" y="106" class="t">40 statistics</text>
  <text x="456" y="126" class="s">one function for recorded</text>
  <text x="456" y="142" class="s">and simulated events:</text>
  <text x="456" y="158" class="s">bursts, synchrony, intervals</text>

  <path class="edge" d="M612 126 L646 126"/>

  <rect x="646" y="80" width="366" height="92" class="box blue"/>
  <text x="660" y="106" class="t">Amortised posterior (trained only on simulations)</text>
  <text x="660" y="126" class="s">5 presence heads: probability each of 10 mechanisms moved</text>
  <text x="660" y="142" class="s">conditional flow: culture parameters, and the size of the</text>
  <text x="660" y="158" class="s">shift given that a mechanism moved, with an interval</text>

  <rect x="28" y="228" width="286" height="118" class="box orange"/>
  <text x="42" y="254" class="t">GPU network twin</text>
  <text x="42" y="274" class="s">256 Hodgkin-Huxley neurons, E and I, AMPA,</text>
  <text x="42" y="290" class="s">NMDA, GABA-A, tonic GABA, short-term</text>
  <text x="42" y="306" class="s">depression, asynchronous release, sAHP;</text>
  <text x="42" y="322" class="s">one network per CUDA block,</text>
  <text x="42" y="338" class="s">bit-reproducible</text>

  <path class="edge" d="M314 287 L352 287"/>

  <rect x="352" y="228" width="276" height="118" class="box orange"/>
  <text x="366" y="254" class="t">Domain and paired bank</text>
  <text x="366" y="274" class="s">cultures inside the range each system's</text>
  <text x="366" y="290" class="s">untreated baselines span, AMPA-dependent;</text>
  <text x="366" y="306" class="s">sparse prior over what a compound does:</text>
  <text x="366" y="322" class="s">one to three mechanisms, never all</text>

  <path class="dash" d="M490 228 L490 200 L700 200 L700 172"/>
  <text x="560" y="194" class="lbl">trains the posterior</text>

  <path class="edge" d="M829 172 L829 228"/>
  <rect x="660" y="228" width="352" height="118" class="box aqua"/>
  <text x="674" y="254" class="t">Guard</text>
  <text x="674" y="274" class="s">typicality: does any simulation resemble this pair?</text>
  <text x="674" y="290" class="s">predictive check: re-simulate at the posterior and</text>
  <text x="674" y="306" class="s">compare; either firing means "outside the model"</text>
  <text x="674" y="322" class="s">thresholds fixed on held-out simulations</text>

  <path class="edge" d="M829 346 L829 392"/>
  <rect x="604" y="392" width="408" height="130" class="box blue"/>
  <text x="618" y="418" class="t">Mechanism report</text>
  <text x="618" y="438" class="s">called mechanism, direction, effect and interval,</text>
  <text x="618" y="454" class="s">mechanism class, rivals it cannot separate;</text>
  <text x="618" y="470" class="s">or no call; or "outside the model", naming nothing</text>
  <text x="618" y="486" class="s">hashed, versioned, with the culture's parameters</text>
  <text x="618" y="506" class="s">web app · static site · Python · Kaggle notebook</text>

  <rect x="28" y="392" width="534" height="130" class="box orange"/>
  <text x="42" y="418" class="t">Two-compartment chip twin and experiment design</text>
  <text x="42" y="438" class="s">two chambers joined by directional microchannels; four readouts:</text>
  <text x="42" y="454" class="s">chamber electrodes, 2 Hz calcium, channel electrodes, chamber</text>
  <text x="42" y="470" class="s">perfusion. For each chip property, which readout resolves it,</text>
  <text x="42" y="486" class="s">computed before the experiment; the prediction was then tested</text>
  <text x="42" y="502" class="s">on recorded microchannel chips.</text>
  <path class="dash" d="M171 346 L171 392"/>
  <text x="180" y="376" class="lbl">same kernel</text>
</svg>
