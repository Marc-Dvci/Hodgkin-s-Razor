<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7684"/>
    </marker>
    <style>
      rect{rx:9}
      .box{fill:#ffffff;stroke:#c9d2dc;stroke-width:1.4}
      .accent{fill:#eef4fd;stroke:#2f6fdb}
      .warm{fill:#fdf2e9;stroke:#d1662b}
      .good{fill:#eaf5ef;stroke:#2f8f5b}
      .grey{fill:#f4f6f9;stroke:#c9d2dc}
      .t{font-size:13px;fill:#1b1f27}
      .s{font-size:11px;fill:#6b7684}
      .h{font-size:11.5px;fill:#2f6fdb;font-weight:600;letter-spacing:.06em}
      .lbl{font-size:10.5px;fill:#6b7684}
      .edge{stroke:#6b7684;stroke-width:1.3;fill:none;marker-end:url(#a)}
    </style>
  </defs>

  <text x="26" y="30" class="h">HODGKIN'S RAZOR</text>
  <text x="26" y="48" class="s">two recordings of one well in, one mechanism out</text>

  <!-- top row -->
  <rect x="26" y="70" width="188" height="74" class="box accent"/>
  <text x="38" y="94" class="t">Recording pair</text>
  <text x="38" y="112" class="s">baseline and treated,</text>
  <text x="38" y="127" class="s">same well, same window</text>

  <path class="edge" d="M214 107 L256 107"/>

  <rect x="256" y="70" width="188" height="74" class="box"/>
  <text x="268" y="94" class="t">22 statistics</text>
  <text x="268" y="112" class="s">one function, used for</text>
  <text x="268" y="127" class="s">simulation and experiment</text>

  <path class="edge" d="M444 107 L486 107"/>

  <rect x="486" y="60" width="216" height="96" class="box accent"/>
  <text x="498" y="84" class="t">Amortised posterior</text>
  <text x="498" y="102" class="s">flow over 14 culture parameters</text>
  <text x="498" y="117" class="s">and the 9 shifts a drug can cause,</text>
  <text x="498" y="132" class="s">plus a calibrated presence head</text>

  <path class="edge" d="M702 107 L866 107 L866 176"/>
  <text x="742" y="100" class="lbl">effect sizes</text>

  <!-- simulator feeds the posterior -->
  <rect x="26" y="182" width="404" height="102" class="box grey"/>
  <text x="40" y="206" class="t">Simulator, the only thing the model is trained on</text>
  <text x="40" y="226" class="s">256 conductance-based neurons read by 16 electrodes</text>
  <text x="40" y="241" class="s">excitatory and inhibitory; AMPA, NMDA and GABA-A</text>
  <text x="40" y="256" class="s">one CUDA block per network, bit-reproducible</text>
  <text x="40" y="271" class="s">150 000 paired simulations, no compound label anywhere</text>
  <path class="edge" d="M430 214 L540 214 L540 160"/>

  <!-- guard -->
  <rect x="486" y="300" width="300" height="86" class="warm box"/>
  <text x="500" y="324" class="t">Posterior predictive check</text>
  <text x="500" y="343" class="s">re-simulate the twin at the fitted</text>
  <text x="500" y="358" class="s">parameters and score the measurement</text>
  <text x="500" y="376" class="s">threshold fixed on held-out simulations</text>
  <path class="edge" d="M650 156 L650 296"/>

  <rect x="826" y="176" width="150" height="76" class="box good"/>
  <text x="838" y="200" class="t">Mechanism</text>
  <text x="838" y="217" class="s">target, direction,</text>
  <text x="838" y="232" class="s">fold change, interval,</text>
  <text x="838" y="247" class="s">probability</text>
  <path class="edge" d="M786 330 L901 330 L901 256"/>
  <text x="800" y="323" class="lbl">inside the model</text>

  <rect x="256" y="308" width="188" height="70" class="box"/>
  <text x="268" y="332" class="t">Nothing named</text>
  <text x="268" y="350" class="s">the recording is outside</text>
  <text x="268" y="365" class="s">what the twin can produce</text>
  <path class="edge" d="M486 343 L448 343"/>
  <text x="446" y="336" class="lbl" text-anchor="end">outside</text>

  <!-- chip band -->
  <rect x="26" y="406" width="950" height="72" class="box"/>
  <text x="40" y="430" class="t">The same kernel runs a two-compartment chip</text>
  <text x="40" y="449" class="s">one-way microchannels, a driven target chamber, and a population calcium readout at 2 Hz</text>
  <text x="40" y="464" class="s">which answers what each readout can resolve, before the experiment is run</text>
</svg>
