<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hodgkin's Razor film</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --ink: #f4f3ef; --ink2: #b9b8b1; --muted: #7d7c76;
    --blue: #3987e5; --orange: #eb6834; --aqua: #1baf7a; --line: #2a2e38;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 900px; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  .scene { position: absolute; inset: 0; opacity: 0; transition: opacity 600ms ease;
    display: flex; flex-direction: column; padding: 56px 72px 215px; }
  .scene.on { opacity: 1; }
  .kicker { font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--blue);
    font-weight: 700; margin-bottom: 14px; }
  h1 { font-size: 64px; line-height: 1.08; font-weight: 700; max-width: 1300px; }
  h2 { font-size: 42px; line-height: 1.15; font-weight: 650; max-width: 1400px; }
  p.lead { font-size: 28px; color: var(--ink2); margin-top: 22px; max-width: 1300px; line-height: 1.35; }
  .media { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; margin-top: 24px; }
  .media img { max-width: 100%; max-height: 100%; border-radius: 14px; box-shadow: 0 18px 60px rgba(0,0,0,.45);
    transform: scale(.985); transition: transform 1200ms ease; background: #fcfcfb; }
  .scene.on .media img { transform: scale(1); }
  .media.dark img { background: transparent; }
  .row { display: flex; gap: 28px; align-items: stretch; flex: 1; min-height: 0; margin-top: 24px; }
  .row > div { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .row img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; background: #fcfcfb; }
  .cap { font-size: 20px; color: var(--ink2); margin-bottom: 10px; }
  .big { display: flex; gap: 60px; margin-top: 40px; align-items: flex-end; }
  .num { font-size: 150px; font-weight: 800; line-height: 1; color: var(--ink);
    opacity: 0; transform: translateY(18px); transition: all 800ms ease; }
  .num small { font-size: 60px; color: var(--ink2); font-weight: 600; }
  .scene.reveal .num { opacity: 1; transform: none; }
  .numcap { font-size: 24px; color: var(--ink2); margin-top: 12px; max-width: 520px; }
  .pill { align-self: flex-start; display: inline-block; padding: 8px 18px; border-radius: 999px; font-size: 22px; font-weight: 650;
    margin-right: 12px; margin-top: 22px; }
  .pill.ok { background: rgba(27,175,122,.18); color: #52d7a4; }
  .pill.no { background: rgba(235,104,52,.18); color: #ff9a6e; }
  .pill.info { background: rgba(57,135,229,.18); color: #7fb3f0; }
  .hash { font-family: ui-monospace, Consolas, monospace; font-size: 22px; color: var(--aqua); margin-top: 18px; }
  .quote { font-size: 44px; line-height: 1.25; font-style: italic; max-width: 1300px; border-left: 6px solid var(--blue);
    padding-left: 30px; margin-top: 30px; }
  .src { font-size: 20px; color: var(--muted); margin-top: 18px; padding-left: 36px; }
  ul.steps { list-style: none; margin-top: 26px; }
  ul.steps li { font-size: 30px; line-height: 1.5; color: var(--ink2); opacity: .25; transition: opacity 500ms ease; }
  ul.steps li.lit { opacity: 1; color: var(--ink); }
  #subs { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; pointer-events: none; }
  #subs span { display: inline-block; max-width: 1360px; font-size: 27px; line-height: 1.35; padding: 8px 18px;
    background: rgba(8,9,12,.78); border-radius: 10px; color: #fff; }
  #subs .zh { display: block; font-size: 25px; margin-top: 6px; color: #e8e7e1; background: transparent; padding: 0; }
  pre.term { margin-top: 24px; flex: 1; min-height: 0; overflow: hidden; background: #07080b;
    border: 1px solid var(--line); border-radius: 12px; padding: 22px 26px; font-family: ui-monospace, Consolas, monospace;
    font-size: 17px; line-height: 1.45; color: #d9d8d2; white-space: pre; }
  .scene.live { padding: 46px 56px 205px; }
  .scene.live .kicker { margin-bottom: 12px; transition: opacity 300ms ease; }
  .livebox { position: relative; flex: 1; min-height: 0; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--line); box-shadow: 0 18px 60px rgba(0,0,0,.45); background: #0e1116; }
  .livebox iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; }
  .cursor { position: absolute; left: 50%; top: 40%; width: 26px; height: 26px; pointer-events: none; z-index: 5;
    transition: left 650ms cubic-bezier(.3,.7,.2,1), top 650ms cubic-bezier(.3,.7,.2,1); opacity: 0; }
  .cursor svg { filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  .ripple { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
    border: 3px solid #5eb0ff; pointer-events: none; z-index: 4; animation: rip 600ms ease-out forwards; }
  @keyframes rip { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .halo { position: absolute; border: 2px solid #5eb0ff; border-radius: 8px; pointer-events: none; z-index: 4;
    box-shadow: 0 0 0 4px rgba(94,176,255,.18); transition: opacity 400ms ease; }
  #brand { position: absolute; right: 36px; top: 26px; font-size: 16px; color: var(--muted); letter-spacing: .08em; }
</style>
</head>
<body>
<div id="brand">HODGKIN'S RAZOR · AI4S OPEN INNOVATION · END-TO-END SYSTEM</div>
<div id="stage"></div>
<div id="subs"><span id="subtext"></span></div>
<script>
// The film reads its story from story.json: one beat per narrated sentence
// group, each with a scene. record.py hands in the measured duration of each
// beat as window.__FILM_TIMING and calls Film.start().
const Film = { beats: 0, captions: [], subtitles: [], done: false };
window.Film = Film;

function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }

function sceneHTML(s) {
  // A continued scene keeps the previous node on screen; it needs none of its own.
  if (s.continue) return `<section class="scene"></section>`;
  const k = s.kicker ? `<div class="kicker">${s.kicker}</div>` : "";
  switch (s.type) {
    case "title":
      return `<section class="scene">${k}<h1>${s.title}</h1>${s.lead ? `<p class="lead">${s.lead}</p>` : ""}
        ${(s.pills || []).map(p => `<span class="pill ${p[0]}">${p[1]}</span>`).join("")}
        ${s.hash ? `<div class="hash">${s.hash}</div>` : ""}</section>`;
    case "image":
      return `<section class="scene">${k}${s.title ? `<h2>${s.title}</h2>` : ""}
        <div class="media${s.dark ? " dark" : ""}"><img src="${s.src}"></div></section>`;
    case "pair":
      return `<section class="scene">${k}${s.title ? `<h2>${s.title}</h2>` : ""}<div class="row">
        ${s.items.map(it => `<div><div class="cap">${it.cap}</div><img src="${it.src}"></div>`).join("")}</div></section>`;
    case "numbers":
      return `<section class="scene">${k}<h2>${s.title}</h2><div class="big">
        ${s.items.map(it => `<div><div class="num">${it.value}${it.of ? `<small>${it.of}</small>` : ""}</div>
          <div class="numcap">${it.cap}</div></div>`).join("")}</div>
        ${(s.pills || []).map(p => `<span class="pill ${p[0]}">${p[1]}</span>`).join("")}</section>`;
    case "quote":
      return `<section class="scene">${k}<div class="quote">${s.text}</div><div class="src">${s.source}</div></section>`;
    case "terminal":
      return `<section class="scene">${k}${s.title ? `<h2>${s.title}</h2>` : ""}<pre class="term">${s.text}</pre></section>`;
    case "live":
      return `<section class="scene live">${k}<div class="livebox"><iframe src="${s.src}" scrolling="no"></iframe>
        <div class="cursor"><svg width="26" height="26" viewBox="0 0 26 26"><path d="M3 2 L3 21 L8.5 16 L12 24 L15.5 22.5 L12 15 L19.5 15 Z"
        fill="#fff" stroke="#0b0e13" stroke-width="1.5"/></svg></div></div></section>`;
    case "steps":
      return `<section class="scene">${k}<h2>${s.title}</h2><ul class="steps">
        ${s.items.map(x => `<li>${x}</li>`).join("")}</ul></section>`;
  }
  return `<section class="scene"><h2>${s.title || ""}</h2></section>`;
}

async function load() {
  const story = await (await fetch("story.json")).json();
  Film.story = story;
  Film.beats = story.beats.length;
  Film.captions = story.beats.map(b => b.say);
  Film.subtitles = story.beats.map(b => b.show || b.say);
  Film.zh = story.beats.map(b => b.zh || "");
  const stage = document.getElementById("stage");
  Film.nodes = story.beats.map(b => { const n = el(sceneHTML(b.scene)); stage.appendChild(n); return n; });
  // Preload every image so a scene never paints half-loaded.
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  // Size each live frame at a zoom so the application reads at film scale.
  const frames = [...document.querySelectorAll(".livebox iframe")];
  for (const f of frames) {
    const box = f.parentElement;
    box.closest(".scene").style.opacity = 0;
    box.closest(".scene").style.display = "flex";
  }
  await new Promise(r => setTimeout(r, 50));
  await Promise.all(frames.map(f => {
    const box = f.parentElement, w = box.clientWidth, h = box.clientHeight;
    f.style.width = (w / ZOOM) + "px"; f.style.height = (h / ZOOM) + "px";
    f.style.transform = `scale(${ZOOM})`;
    return new Promise(r => {
      const ok = () => { try { const d = f.contentDocument; return d && d.readyState === "complete" && d.getElementById("example") && d.getElementById("example").options.length; } catch (e) { return false; } };
      const poll = () => ok() ? setTimeout(r, 300) : setTimeout(poll, 100);
      poll();
    });
  }));
  for (const f of frames) f.closest(".scene").style.opacity = "";
  Film.ready = true;
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

// ---- live scenes: drive the real application inside its frame ----
const ZOOM = 1.18;
Film.missed = [];
function frameOf(node) { return node.querySelector(".livebox iframe"); }
function target(node, sel) {
  const f = frameOf(node), d = f.contentDocument, el = d.querySelector(sel);
  if (!el) Film.missed.push(sel);
  return { f, d, el };
}
function boxPos(node, el) {
  // Element centre in livebox pixels.
  const r = el.getBoundingClientRect();
  return { x: (r.left + r.width / 2) * ZOOM, y: (r.top + r.height / 2) * ZOOM, r };
}
function moveCursor(node, el) {
  // Wide blocks (rows, panels, paragraphs) are pointed at near their left edge.
  const c = node.querySelector(".cursor"), p = boxPos(node, el);
  const wide = ["TR", "DIV", "P"].includes(el.tagName);
  c.style.opacity = 1; c.style.left = (wide ? p.r.left * ZOOM + 60 : p.x) + "px";
  c.style.top = p.y + "px";
  return p;
}
function halo(node, el) {
  const box = node.querySelector(".livebox"), r = el.getBoundingClientRect();
  const h = document.createElement("div"); h.className = "halo";
  h.style.left = (r.left * ZOOM - 6) + "px"; h.style.top = (r.top * ZOOM - 6) + "px";
  h.style.width = (r.width * ZOOM + 12) + "px"; h.style.height = (r.height * ZOOM + 12) + "px";
  box.appendChild(h);
  setTimeout(() => { h.style.opacity = 0; }, 2600);
  setTimeout(() => h.remove(), 3100);
}
function ripple(node, p) {
  const box = node.querySelector(".livebox"), d = document.createElement("div");
  d.className = "ripple"; d.style.left = p.x + "px"; d.style.top = p.y + "px";
  box.appendChild(d); setTimeout(() => d.remove(), 700);
}
function scrollFrame(node, sel, offset, top) {
  const { f, el } = target(node, sel);
  if (!el && !top) return;
  const w = f.contentWindow, from = w.scrollY;
  const to = top ? 0 : Math.max(0, from + el.getBoundingClientRect().top - (offset || 20));
  const steps = 28;
  for (let k = 1; k <= steps; k++) setTimeout(() => {
    const t = k / steps, e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    w.scrollTo(0, from + (to - from) * e);
  }, k * 32);
}
function act(node, a) {
  if (a.do === "scroll") return scrollFrame(node, a.sel, a.offset, a.top);
  const { d, el } = target(node, a.sel);
  if (!el) return;
  if (a.do === "point") { moveCursor(node, el); setTimeout(() => halo(node, el), 500); return; }
  const p = moveCursor(node, el);
  if (a.do === "click") {
    setTimeout(() => { ripple(node, boxPos(node, el)); el.dispatchEvent(new MouseEvent("click", { bubbles: true })); }, 700);
  } else if (a.do === "select") {
    setTimeout(() => { ripple(node, p); el.value = a.value; el.dispatchEvent(new Event("change", { bubbles: true })); halo(node, el); }, 700);
  } else if (a.do === "slide") {
    const n = a.to - a.from;
    el.value = a.from; el.dispatchEvent(new Event("input", { bubbles: true }));
    for (let k = 1; k <= n; k++) setTimeout(() => {
      el.value = a.from + k; el.dispatchEvent(new Event("input", { bubbles: true }));
      const r = el.getBoundingClientRect(), frac = (el.value - el.min) / (el.max - el.min);
      const c = node.querySelector(".cursor");
      c.style.left = ((r.left + frac * r.width) * ZOOM) + "px"; c.style.top = ((r.top + r.height / 2) * ZOOM) + "px";
    }, 700 + k * 650);
  }
}
function runActions(node, b, cues, T) {
  const n = Math.max(1, (cues || []).length);
  for (const a of (b.actions || [])) {
    const at = cues && cues[a.cue] !== undefined ? cues[a.cue] : (a.cue / n) * T;
    setTimeout(() => act(node, a), Math.max(0, at - 250) + (a.delay || 0));
  }
}

Film.start = async function () {
  const T = window.__FILM_TIMING || Film.story.beats.map(() => 4000);
  let prev = null;
  for (let i = 0; i < Film.beats; i++) {
    const b = Film.story.beats[i];
    const node = Film.nodes[i];
    const same = b.scene.continue && prev;
    const cur = same ? prev : node;
    if (!same) { if (prev) prev.classList.remove("on"); node.classList.add("on"); }
    else if (b.scene.kicker && cur.querySelector(".kicker")) cur.querySelector(".kicker").textContent = b.scene.kicker;
    if (cur.querySelector(".livebox")) runActions(cur, b, (window.__FILM_CUES || [])[i], T[i]);
    document.getElementById("subtext").innerHTML =
      (b.show || b.say) + (b.zh ? `<span class="zh">${b.zh}</span>` : "");
    if (cur.querySelector(".num")) setTimeout(() => cur.classList.add("reveal"), b.reveal_ms || 700);
    const lis = cur.querySelectorAll("ul.steps li");
    if (lis.length) {
      const n = lis.length, step = T[i] / (n + 0.5);
      lis.forEach((li, k) => setTimeout(() => li.classList.add("lit"), 300 + k * step));
    }
    await wait(T[i]);
    prev = cur;
  }
  Film.done = true;
};

load();
</script>
</body>
</html>
